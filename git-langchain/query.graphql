query GetOdysseyData($owner: String!, $repoName: String!) {
  repository(owner: $owner, name: $repoName) {
    # Pull Requests
    pullRequests(first: 100, orderBy: { field: CREATED_AT, direction: DESC }) {
      nodes {
        number
        title
        body
        state
        createdAt
        mergedAt
        closedAt
        author {
          login
        }
        baseRefName
        headRefName

        # Commits in this PR
        commits(first: 100) {
          nodes {
            commit {
              oid
            }
          }
        }

        # Files changed
        files(first: 100) {
          nodes {
            path
            additions
            deletions
            changeType
          }
        }
      }
    }

    # Issues
    issues(first: 100, orderBy: { field: CREATED_AT, direction: DESC }) {
      nodes {
        number
        title
        body
        state
        createdAt
        closedAt
        author {
          login
        }
        labels(first: 20) {
          nodes {
            name
            color
          }
        }
      }
    }
  }
}
